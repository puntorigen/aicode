name: CI

# The tests run for the final pull request, not for every push of the work in progress: while the
# pull request is a draft the job below is skipped (no runner starts), and marking it ready for
# review (`gh pr ready`) is what runs it. Until then the suite runs locally (`npm test`).
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install ripgrep (exercises the live grep path)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - run: npm ci
      - name: Build the IDE extension (type-checks TypeScript)
        run: npm run build:ide --if-present
      - run: npm test
